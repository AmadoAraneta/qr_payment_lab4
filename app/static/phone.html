<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Demo Phone Payment</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#18212f;background:#eef3f8}body{margin:0}.wrap{max-width:520px;margin:40px auto;padding:0 18px}.card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 8px 28px #183b5d1a}h1{margin-top:0}.warning{background:#fff7df;border:1px solid #f3cf66;border-radius:10px;padding:12px}.details{margin:22px 0}.row{display:flex;justify-content:space-between;border-bottom:1px solid #e6ebf1;padding:12px 0}.label{color:#667085}button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}.pay{background:#138a55;color:#fff}.decline{background:#fff;color:#b42318;border:1px solid #e2a5a5}.result{margin-top:18px;font-weight:700;text-align:center}.success{background:#d8f5e4;color:#087443;border:2px solid #65c78f;border-radius:12px;padding:18px;font-size:21px}.failure{color:#b42318}</style></head>
<body><main class="wrap"><section class="card"><h1>Demo QR Payment</h1><div class="warning"><strong>SIMULATION ONLY</strong><br>No card numbers, PINs, passwords, bank details, or real wallet credentials are requested.</div><div class="details"><div class="row"><span class="label">Transaction ID</span><strong id="tx">Loading…</strong></div><div class="row"><span class="label">Amount</span><strong id="amount">Loading…</strong></div><div class="row"><span class="label">Payment method</span><strong>QR</strong></div></div><button class="pay" id="pay">Pay Demo</button><button class="decline" id="decline">Decline Demo</button><p class="result" id="result"></p></section></main>
<script>const token='__PAYMENT_TOKEN__';const $=id=>document.getElementById(id);fetch('/api/payments/'+token).then(r=>r.json()).then(d=>{$('tx').textContent=d.transaction_id;$('amount').textContent=Number(d.amount).toFixed(2)+' DEMO'});async function confirm(value){$('pay').disabled=true;$('decline').disabled=true;const r=await fetch('/api/payments/'+token+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmation:value})});const d=await r.json();if(r.status===409){$('result').textContent='DUPLICATE: this payment was already confirmed';$('result').className='result failure';return}if(d.status==='SUCCESS'){$('result').textContent='PAYMENT APPROVED — opening receipt…';$('result').className='result success';setTimeout(()=>{window.location.href='/receipt/'+token},650)}else{$('result').textContent='PAYMENT FAILED — demo payment declined';$('result').className='result failure'}}$('pay').onclick=()=>confirm('DEMO-APPROVE');$('decline').onclick=()=>confirm('DEMO-DECLINE');</script></body></html>
